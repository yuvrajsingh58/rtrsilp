<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Account</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 30px;

            background: #f4f6f8;

            font-family: Arial, sans-serif;

        }


        .container {

            max-width: 650px;

            margin: auto;

        }


        .box {

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.10);

        }


        h1 {

            text-align: center;

            margin-bottom: 30px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

        }


        input {

            width: 100%;

            padding: 12px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

        }


        .update-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #f59e0b;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        .back-button {

            display: block;

            margin-top: 15px;

            padding: 12px;

            text-align: center;

            background: #6b7280;

            color: white;

            text-decoration: none;

            border-radius: 7px;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="box">


        <h1>
            ✏️ Edit Account
        </h1>


        <form
            action="/update-account/{{ customer['id'] }}"
            method="POST"
        >


            <div class="form-group">

                <label>
                    Account Number
                </label>

                <input
                    type="text"
                    name="account_number"
                    value="{{ customer['account_number'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ customer['name'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="text"
                    name="mobile"
                    value="{{ customer['mobile'] or '' }}"
                >

            </div>


            <div class="form-group">

                <label>
                    Bank Name
                </label>

                <input
                    type="text"
                    name="bank_name"
                    value="{{ customer['bank_name'] or '' }}"
                >

            </div>


            <div class="form-group">

                <label>
                    IFSC Code
                </label>

                <input
                    type="text"
                    name="ifsc_code"
                    value="{{ customer['ifsc_code'] or '' }}"
                >

            </div>


            <button
                type="submit"
                class="update-button"
            >
                ✅ Update Account
            </button>


        </form>


        <a
            href="/"
            class="back-button"
        >
            ⬅️ Back
        </a>


    </div>


</div>


</body>

</html>
