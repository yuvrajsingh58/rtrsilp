<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 30px;

            background: #d659b7;

            font-family: Arial, sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 100vh;

        }


        .container {

            max-width: 400px;

            width: 100%;

        }


        .box {

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.10);

        }


        h1 {

            text-align: center;

            margin-bottom: 30px;

            font-size: 24px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

        }


        input {

            width: 100%;

            padding: 12px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #f59e0b;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        .error-box {

            background: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="box">


        <h1>
            🔐 Login
        </h1>


        {% if error %}

        <div class="error-box">
            {{ error }}
        </div>

        {% endif %}


        <form
            action="{{ url_for('login') }}"
            method="POST"
        >

            <input
                type="hidden"
                name="next"
                value="{{ next_page or '' }}"
            >


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    autofocus
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                ✅ Login
            </button>


        </form>


    </div>


</div>


</body>

</html>
