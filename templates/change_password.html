<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Change Password</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 30px;

            background: #f4f6f8;

            font-family: Arial, sans-serif;

        }


        .container {

            max-width: 450px;

            margin: auto;

        }


        .box {

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.10);

        }


        h1 {

            text-align: center;

            margin-bottom: 30px;

            font-size: 24px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

        }


        input {

            width: 100%;

            padding: 12px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

        }


        .update-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #f59e0b;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        .back-button {

            display: block;

            margin-top: 15px;

            padding: 12px;

            text-align: center;

            background: #6b7280;

            color: white;

            text-decoration: none;

            border-radius: 7px;

        }


        .error-box {

            background: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;

        }


        .success-box {

            background: #dcfce7;

            color: #15803d;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="box">


        <h1>
            🔑 Change Password
        </h1>


        {% if error %}

        <div class="error-box">
            {{ error }}
        </div>

        {% endif %}


        {% if success %}

        <div class="success-box">
            {{ success }}
        </div>

        {% endif %}


        <form
            action="{{ url_for('change_password') }}"
            method="POST"
        >


            <div class="form-group">

                <label>
                    Current Password
                </label>

                <input
                    type="password"
                    name="current_password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="update-button"
            >
                ✅ Update Password
            </button>


        </form>


        <a
            href="{{ url_for('home') }}"
            class="back-button"
        >
            ⬅️ Back to Home
        </a>


    </div>


</div>


</body>

</html>
